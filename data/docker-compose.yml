version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: BallingDuckDb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: BallingDuckDb
    ports:
      - "5432:5432"
    volumes:
      - ./dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres:
